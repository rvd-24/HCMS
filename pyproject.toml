[project]
name = "prescript-invite"
version = "0.2.0"
description = "Prescription intake, visit history and appointment scheduling for clinics — FastAPI backend + React frontend."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-storage-blob>=12.31.0",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
    "langchain-core>=1.5.4",
    "langchain-openai>=1.4.3",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.0",
]

[project.scripts]
prescript = "prescript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/prescript"]
