# Render's free tier sleeps the backend after ~15 idle minutes; a cold start takes
# up to a minute. Ping the health check once an hour (on the hour).
# GitHub may delay scheduled runs by a few minutes, and pauses them after 60 days
# without a commit to the repo — re-enable from the Actions tab if that happens.
name: Keep backend awake

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://hcms-wd7f.onrender.com/api/health
